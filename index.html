            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text).then(() => {
                    setToast({ show: true, message: "提示詞已複製！" });
                    setTimeout(() => setToast({ show: false, message: "" }), 2000);
                });
            };

            const filteredData = filter === "全部" 
                ? promptsData 
                : promptsData.filter(item => item.category === filter);

            return (
                <div className="min-h-screen flex flex-col text-stone-800">
                    {/* Header */}
                    <header className="bg-white border-b border-stone-200 sticky top-0 z-30 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-yellow-400 p-2 rounded-lg text-white shadow-sm">
                                    <Icons.Banana className="w-6 h-6 text-stone-900" />
                                </div>
                                <div className="leading-tight">
                                    <h1 className="text-xl font-bold tracking-tight text-stone-900 flex items-center gap-2">
                                        Nano Banana Pro
                                        <span className="text-green-600 text-sm bg-green-50 px-2 py-0.5 rounded-full border border-green-100">v1.3.0</span>
                                    </h1>
                                    <p className="text-xs text-stone-500 hidden sm:block">互動式提示詞視覺化大師</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-2 md:gap-4">
                                <button 
                                    onClick={() => setShowIntro(true)}
                                    className="px-3 py-2 text-stone-600 hover:text-stone-900 hover:bg-stone-100 rounded-lg transition-all flex items-center gap-2 text-sm font-medium"
                                >
                                    <Icons.HelpCircle className="w-4 h-4" />
                                    <span className="hidden md:inline">關於模型</span>
                                </button>
                                
                                <button 
                                    onClick={() => setShowGuide(true)}
                                    className="px-3 py-2 text-stone-600 hover:text-stone-900 hover:bg-stone-100 rounded-lg transition-all flex items-center gap-2 text-sm font-medium"
                                >
                                    <Icons.BookOpen className="w-4 h-4" />
                                    <span className="hidden md:inline">功能與技巧</span>
                                </button>
                                
                                <button 
                                    onClick={() => setShowGenerator(true)}
                                    className="px-3 py-2 bg-stone-900 text-white hover:bg-stone-700 rounded-lg transition-all flex items-center gap-2 text-sm font-medium shadow-sm"
                                >
                                    <Icons.Wand2 className="w-4 h-4 text-yellow-300" />
                                    <span className="hidden md:inline">提示詞生成器</span>
                                </button>

                                <div className="h-6 w-px bg-stone-200 mx-1"></div>

                                <button 
                                    onClick={toggleFullscreen}
                                    className="p-2 text-stone-500 hover:text-stone-900 hover:bg-stone-100 rounded-lg transition-all"
                                    title={isFullscreen ? "退出全螢幕" : "全螢幕模式"}
                                >
                                    {isFullscreen ? <Icons.Minimize className="w-5 h-5" /> : <Icons.Maximize className="w-5 h-5" />}
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-grow p-4 sm:p-6 lg:p-8 max-w-[1600px] mx-auto w-full">
                        
                        {/* Intro / Banner */}
                        <div className="mb-8 bg-gradient-to-r from-green-600 to-emerald-700 rounded-2xl p-6 sm:p-10 text-white shadow-lg relative overflow-hidden">
                            <div className="absolute top-0 right-0 opacity-10 transform translate-x-1/4 -translate-y-1/4">
                                <Icons.Map className="w-64 h-64" />
                            </div>
                            <div className="relative z-10 max-w-3xl">
                                <h2 className="text-3xl font-bold mb-4 flex items-center gap-2">
                                    <Icons.Sparkles className="w-8 h-8 text-yellow-300" />
                                    新增 20+ 組專業提示詞
                                </h2>
                                <p className="text-green-50 text-lg mb-6 leading-relaxed">
                                    v1.3.0 大幅擴充！新增「關於模型」按鈕。
                                </p>
                                <div className="flex flex-wrap gap-2 max-w-full overflow-x-auto pb-2 hide-scrollbar">
                                    {categories.map(cat => (
                                        <button
                                            key={cat}
                                            onClick={() => setFilter(cat)}
                                            className={`px-4 py-2 rounded-full text-sm font-medium transition-all whitespace-nowrap ${
                                                filter === cat 
                                                ? 'bg-white text-green-700 shadow-md' 
                                                : 'bg-green-700/30 text-green-50 hover:bg-green-700/50'
                                            }`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Grid Layout */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                            {filteredData.map(item => (
                                <Card key={item.id} item={item} onCopy={copyToClipboard} />
                            ))}
                        </div>

                        {/* Empty State */}
                        {filteredData.length === 0 && (
                            <div className="text-center py-20">
                                <p className="text-stone-400 text-lg">沒有找到符合「{filter}」類別的提示詞。</p>
                                <button 
                                    onClick={() => setFilter("全部")}
                                    className="mt-4 text-green-600 hover:underline"
                                >
                                    查看全部
                                </button>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t border-stone-200 mt-12 py-8">
                        <div className="max-w-7xl mx-auto px-4 text-center text-stone-500 text-sm">
                            <p className="mb-2">資料來源整理自 Github (PicoTrex, muset-ai), Skywork, YouMind, KOC.com.tw</p>
                            <p>© 2025 Nano Banana Pro 提示詞大師 - 軟體設計大師版本 v1.3.0</p>
                        </div>
                    </footer>

                    {/* Toast Notification */}
                    <Toast message={toast.message} show={toast.show} />

                    {/* Guide Modal */}
                    <Modal 
                        isOpen={showGuide} 
                        onClose={() => setShowGuide(false)} 
                        title="Google 官方釋出 7 個 Nano Banana Pro 使用技巧"
                    >
                        <div className="space-y-6 text-stone-700">
                            <section>
                                <h4 className="font-bold text-green-700 mb-2 flex items-center gap-2">
                                    <span className="bg-green-100 px-2 rounded">1</span> 建立清楚的畫面願景
                                </h4>
                                <p className="text-sm">提示詞應包含：<span className="font-medium">主體</span>(具體描述)、<span className="font-medium">構圖</span>(視角/鏡頭)、<span className="font-medium">動作</span>(正在做什麼)、<span className="font-medium">場景</span>(地點)、<span className="font-medium">風格</span>(美學/畫風)。</p>
                            </section>
                            <section>
                                <h4 className="font-bold text-green-700 mb-2 flex items-center gap-2">
                                    <span className="bg-green-100 px-2 rounded">2</span> 進階細節設定
                                </h4>
                                <ul className="list-disc pl-5 text-sm space-y-1">
                                    <li>設定光圈/景深 (例如: f/1.8 淺景深)</li>
                                    <li>指定光線氛圍 (例如: 逆光、黃昏)</li>
                                    <li>文字呈現要求 (例如: 以粗體白色呈現標題)</li>
                                </ul>
                            </section>
                            <section>
                                <h4 className="font-bold text-green-700 mb-2 flex items-center gap-2">
                                    <span className="bg-green-100 px-2 rounded">3</span> 善用世界知識與翻譯
                                </h4>
                                <p className="text-sm">利用 Gemini 的背景知識生成具正確細節的影像（如資訊圖表），或將圖片內文字翻譯成多國語言。</p>
                            </section>
                            <section>
                                <h4 className="font-bold text-green-700 mb-2 flex items-center gap-2">
                                    <span className="bg-green-100 px-2 rounded">4</span> 專業攝影棚控制
                                </h4>
                                <p className="text-sm">控制光線方向、鏡頭角度、焦距、色彩分級與材質質感。</p>
                            </section>
                            <section>
                                <h4 className="font-bold text-green-700 mb-2 flex items-center gap-2">
                                    <span className="bg-green-100 px-2 rounded">5</span> 精準影像尺寸
                                </h4>
                                <p className="text-sm">支援 1K、2K、4K 解析度，並可自由調整比例 (如 16:9, 9:16) 以符合不同平台。</p>
                            </section>
                            <section>
                                <h4 className="font-bold text-green-700 mb-2 flex items-center gap-2">
                                    <span className="bg-green-100 px-2 rounded">6</span> 維持一致性
                                </h4>
                                <p className="text-sm">可匯入 6~14 張圖片，保持角色外貌、風格一致，適合製作連貫的故事插圖。</p>
                            </section>
                            <section>
                                <h4 className="font-bold text-green-700 mb-2 flex items-center gap-2">
                                    <span className="bg-green-100 px-2 rounded">7</span> 品牌形象應用
                                </h4>
                                <p className="text-sm">穩定呈現品牌字型、配色、Logo，非常適合製作產品 Mockup 與廣告視覺。</p>
                            </section>
                        </div>
                    </Modal>

                    {/* Generator Modal */}
                    <Modal 
                        isOpen={showGenerator} 
                        onClose={() => setShowGenerator(false)} 
                        title={<span className="flex items-center gap-2"><Icons.Wand2 className="w-6 h-6 text-yellow-500"/> Nano Banana Pro 提示詞生成器</span>}
                    >
                        <PromptGenerator onCopy={copyToClipboard} />
                    </Modal>
                    
                     {/* Intro Modal */}
                    <Modal 
                        isOpen={showIntro} 
                        onClose={() => setShowIntro(false)} 
                        title={<span className="flex items-center gap-2"><Icons.HelpCircle className="w-6 h-6 text-blue-500"/> 關於 Nano Banana Pro</span>}
                    >
                        <div className="space-y-8 text-stone-700">
                            <section>
                                <h4 className="text-lg font-bold text-stone-800 mb-3 border-b border-stone-200 pb-1">
                                    產品概述
                                </h4>
                                <p className="leading-relaxed text-sm">
                                    <span className="font-bold text-stone-900">Nano Banana Pro</span> 是 Google 基於最新 <span className="font-bold text-blue-600">Gemini 3</span> 架構所打造的旗艦級圖像生成模型。
                                    它突破了傳統 AI 繪圖的限制，具備更強大的邏輯推理能力，能夠精準理解複雜的長篇提示詞，並將創意轉化為專業級的視覺作品。
                                </p>
                            </section>

                            <section>
                                <h4 className="text-lg font-bold text-stone-800 mb-3 border-b border-stone-200 pb-1">
                                    核心特色
                                </h4>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                                    <div className="bg-stone-50 p-3 rounded-lg">
                                        <h5 className="font-bold text-stone-900 mb-1 flex items-center gap-1"><Icons.Sparkles className="w-4 h-4 text-yellow-500"/> 極致畫質</h5>
                                        <p className="text-stone-600">支援原生 4K 解析度生成，細節豐富，光影真實。</p>
                                    </div>
                                    <div className="bg-stone-50 p-3 rounded-lg">
                                        <h5 className="font-bold text-stone-900 mb-1 flex items-center gap-1"><Icons.Banana className="w-4 h-4 text-yellow-500"/> 精準文字</h5>
                                        <p className="text-stone-600">完美渲染繁體中文與各國語言，不再是亂碼。</p>
                                    </div>
                                    <div className="bg-stone-50 p-3 rounded-lg">
                                        <h5 className="font-bold text-stone-900 mb-1 flex items-center gap-1"><Icons.Check className="w-4 h-4 text-green-500"/> 高度一致性</h5>
                                        <p className="text-stone-600">可維持角色、風格在多張圖片中的連貫性。</p>
                                    </div>
                                    <div className="bg-stone-50 p-3 rounded-lg">
                                        <h5 className="font-bold text-stone-900 mb-1 flex items-center gap-1"><Icons.Map className="w-4 h-4 text-blue-500"/> 世界知識</h5>
                                        <p className="text-stone-600">整合 Google Search，生成具備正確知識的圖表。</p>
                                    </div>
                                </div>
                            </section>

                            <section>
                                <h4 className="text-lg font-bold text-stone-800 mb-3 border-b border-stone-200 pb-1">
                                    如何使用
                                </h4>
                                <ol className="list-decimal pl-5 space-y-2 text-sm">
                                    <li>
                                        <span className="font-bold text-stone-900">選擇模型：</span> 在 Gemini App 或支援的平台上，選擇「Thinking」或「Nano Banana Pro」模型。
                                    </li>
                                    <li>
                                        <span className="font-bold text-stone-900">輸入提示詞：</span> 使用本工具提供的「提示詞生成器」或參考範例，輸入詳細的描述。
                                    </li>
                                    <li>
                                        <span className="font-bold text-stone-900">調整與優化：</span> 若結果不滿意，可使用對話方式請 AI 修改（如：「把背景換成晚上」）。
                                    </li>
                                </ol>
                            </section>
                        </div>
                    </Modal>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
